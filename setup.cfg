[flake8]
exclude =
    .git,
    __pycache__,
    venv,
    idea,
    .venv
max-line-length = 120
# E203 xung dot voi black o cac slice kieu `element[element.find("page") :]`
extend-ignore = E203
inline-quotes = single
multiline-quotes = '''
avoid-escape = True

[tool:pytest]
testpaths = tests/
norecursedirs = .git venv/ .pytest_cache/ main/